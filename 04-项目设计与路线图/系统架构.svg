<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="0.52" stop-color="#FAFBFF"/>
      <stop offset="1" stop-color="#F3FBF8"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <linearGradient id="sample" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E8"/>
      <stop offset="1" stop-color="#FFFDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8A9BB1"/>
    </marker>
    <style>
      .ink{fill:#102A43}.body{fill:#334E68}.muted{fill:#718096}
      .tiny{font-size:13px}.small{font-size:15px}.label{font-size:16px;font-weight:700}
      .cardTitle{font-size:18px;font-weight:700;fill:#102A43}.cardBody{font-size:14px;fill:#52677F}
      .chip{font-size:13px;font-weight:700;fill:#FFFFFF}.mono{font-family:'SFMono-Regular',Consolas,monospace}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="210" fill="#DDF5EF" opacity="0.48"/>
  <circle cx="95" cy="980" r="260" fill="#E5EEFF" opacity="0.65"/>

  <text x="80" y="74" class="ink" font-size="38" font-weight="800">一句话稳剪，确认后再扩展</text>
  <text x="80" y="108" class="body" font-size="18">ChatCut 官方能力之上的安全默认、审批、恢复与证据交付层</text>
  <rect x="1380" y="48" width="140" height="38" rx="19" fill="#102A43"/>
  <text x="1450" y="73" class="chip" text-anchor="middle">v1.6.0</text>

  <rect x="80" y="140" width="1440" height="92" rx="22" fill="url(#prompt)" filter="url(#shadow)"/>
  <text x="112" y="180" fill="#D8FFFA" font-size="15" font-weight="700">用户只需要说</text>
  <text x="112" y="211" fill="#FFFFFF" font-size="25" font-weight="750">“用马甲稳剪当前口播”</text>
  <g transform="translate(900 166)">
    <rect width="130" height="38" rx="19" fill="#FFFFFF" opacity="0.15"/>
    <text x="65" y="25" class="chip" text-anchor="middle">稳剪 stable</text>
    <rect x="146" width="130" height="38" rx="19" fill="#FFFFFF" opacity="0.15"/>
    <text x="211" y="25" class="chip" text-anchor="middle">快剪 fast</text>
    <rect x="292" width="150" height="38" rx="19" fill="#FFFFFF" opacity="0.15"/>
    <text x="367" y="25" class="chip" text-anchor="middle">专业增强 pro</text>
  </g>

  <text x="80" y="278" class="ink" font-size="17" font-weight="750">主流程</text>
  <text x="1508" y="278" class="muted tiny" text-anchor="end">默认停在可审阅时间线，不自动导出或发布</text>

  <g filter="url(#shadow)">
    <rect x="80" y="300" width="178" height="148" rx="18" fill="#FFFFFF" stroke="#D6E1EE"/>
    <rect x="280" y="300" width="178" height="148" rx="18" fill="#FFFFFF" stroke="#D6E1EE"/>
    <rect x="480" y="300" width="178" height="148" rx="18" fill="url(#sample)" stroke="#F4C86A" stroke-width="2"/>
    <rect x="680" y="300" width="178" height="148" rx="18" fill="#FFF8E8" stroke="#F59E0B" stroke-width="2"/>
    <rect x="880" y="300" width="178" height="148" rx="18" fill="#FFFFFF" stroke="#D6E1EE"/>
    <rect x="1080" y="300" width="178" height="148" rx="18" fill="#FFFFFF" stroke="#D6E1EE"/>
    <rect x="1280" y="300" width="240" height="148" rx="18" fill="#EEFBF6" stroke="#65BFA7" stroke-width="2"/>
  </g>

