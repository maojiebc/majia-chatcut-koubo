    <text x="369" y="340">② 转写与风险</text>
    <text x="569" y="340">③ 代表样片</text>
    <text x="769" y="340">④ 用户确认</text>
    <text x="969" y="340">⑤ 整片 A-roll</text>
    <text x="1169" y="340">⑥ 声音与字幕</text>
    <text x="1400" y="340">⑦ 验证与交付</text>
  </g>
  <g class="cardBody" text-anchor="middle">
    <text x="169" y="374">会话 · 项目 · 素材</text><text x="169" y="399">安全默认 · 运行清单</text><text x="169" y="424">能力不足就阻断</text>
    <text x="369" y="374">保护数字与专名</text><text x="369" y="399">低 / 中 / 高风险</text><text x="369" y="424">每项都有理由证据</text>
    <text x="569" y="374">开头 + 复杂切点</text><text x="569" y="399">重说 · 停顿 · 隐私</text><text x="569" y="424">只改代表窗口</text>
    <text x="769" y="374">继续 / 自然 / 更紧</text><text x="769" y="399">或查看高风险项</text><text x="769" y="424">指纹变化即失效</text>
    <text x="969" y="374">仅扩展批准策略</text><text x="969" y="399">小批写入后回读</text><text x="969" y="424">手工修改优先</text>
    <text x="1169" y="374">单一对白主轨</text><text x="1169" y="399">声音平滑后字幕</text><text x="1169" y="424">正式字幕最后生成</text>
    <text x="1400" y="374">结构 · 画面 · 音频</text><text x="1400" y="399">试听 · 隐私 · 审批</text><text x="1400" y="424">可编辑时间线 + 报告</text>
  </g>

  <g stroke="#8A9BB1" stroke-width="2" marker-end="url(#arrow)">
    <path d="M258 374H274"/><path d="M458 374H474"/><path d="M658 374H674"/>
    <path d="M858 374H874"/><path d="M1058 374H1074"/><path d="M1258 374H1274"/>
  </g>

  <text x="80" y="500" class="ink" font-size="17" font-weight="750">四套可复现默认方案</text>
  <g>
    <rect x="80" y="522" width="340" height="102" rx="16" fill="#EEF5FF" stroke="#B7CDF2"/>
    <rect x="446" y="522" width="340" height="102" rx="16" fill="#F3EEFF" stroke="#C7B6EF"/>
    <rect x="812" y="522" width="340" height="102" rx="16" fill="#FFF6EA" stroke="#EFCB91"/>
    <rect x="1178" y="522" width="342" height="102" rx="16" fill="#EAF9F4" stroke="#A9DCCB"/>
  </g>
  <g class="cardTitle">
    <text x="104" y="556">balanced-stable</text><text x="470" y="556">tight-short</text>
    <text x="836" y="556">trust-longform</text><text x="1202" y="556">screen-demo</text>
  </g>
  <g class="cardBody">
    <text x="104" y="586">日常口播 · 原顺序 · 自然节奏</text><text x="104" y="609">低风险自动，中风险进样片</text>
    <text x="470" y="586">30–90 秒 · 更紧但不冒进</text><text x="470" y="609">钩子与重排仍需明确确认</text>
    <text x="836" y="586">5–30 分钟 · 保护论证链</text><text x="836" y="609">首 60 秒 + 复杂段 + 片尾</text>
    <text x="1202" y="586">屏幕证据优先 · 人物按需</text><text x="1202" y="609">隐私检查和字幕避让为硬闸</text>
  </g>

  <text x="80" y="674" class="ink" font-size="17" font-weight="750">四道安全护栏</text>
  <g filter="url(#shadow)">
    <rect x="80" y="696" width="340" height="116" rx="18" fill="#FFFFFF"/>
    <rect x="446" y="696" width="340" height="116" rx="18" fill="#FFFFFF"/>
    <rect x="812" y="696" width="340" height="116" rx="18" fill="#FFFFFF"/>
    <rect x="1178" y="696" width="342" height="116" rx="18" fill="#FFFFFF"/>
  </g>
  <g class="cardTitle">
    <text x="104" y="734">风险闸</text><text x="470" y="734">审批闸</text><text x="836" y="734">恢复闸</text><text x="1202" y="734">证据闸</text>
  </g>
  <g class="cardBody">
    <text x="104" y="764">整句 · 数字 · 否定 · 隐私</text><text x="104" y="788">生成 · 导出均需明确批准</text>
    <text x="470" y="764">计划 / 风格 / 版式 / 字幕</text><text x="470" y="788">时间线版本 / 窗口范围绑定</text>
    <text x="836" y="764">超时先回读 · 幂等不重复写</text><text x="836" y="788">部分写入补偿 · 三轮止损</text>
    <text x="1202" y="764">结构 ≠ 画面 ≠ 音频 ≠ 试听</text><text x="1202" y="788">无证据保持 UNVERIFIED</text>
  </g>

  <rect x="80" y="846" width="1440" height="70" rx="18" fill="#102A43"/>
  <text x="108" y="876" fill="#9FE3D3" font-size="14" font-weight="700">ChatCut 官方 15 个 Skill 是执行底座</text>
  <text x="108" y="899" fill="#EAF2FA" class="tiny mono">project · import · talking-head · transcription · verification · multicam · music · graphics · shader · video · voice · export · errors · help · forms</text>

  <rect x="80" y="936" width="1440" height="40" rx="12" fill="#FFF3D7" stroke="#E6B957"/>
  <text x="100" y="961" fill="#7A4C00" font-size="14" font-weight="700">当前边界：离线合同与匿名恢复模拟已验证；真实 ChatCut 写入、合成画面、人耳试听与匿名生产样本仍为 UNVERIFIED。</text>

  <text x="80" y="994" class="muted tiny">ChatCut口播 · 马甲实战版 · v1.6.0 · editable timeline by default · no automatic export or publishing</text>
